<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraFill</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    padding: 2rem 1.25rem;
  }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: 2.2rem; margin: 0 0 .4rem; letter-spacing: -.02em; }
  p { line-height: 1.65; color: #4a4a4a; }
  nav { margin-top: 1.8rem; display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block;
    padding: .6rem 1.2rem;
    border-radius: 8px;
    border: 1.5px solid #4a9d3f;
    color: #2f7d24;
    text-decoration: none;
    font-weight: 600;
  }
  a.btn:hover { background: #f2f8f0; }
  @media (prefers-color-scheme: dark) {
    body { background: #12160f; color: #e8ece6; }
    p { color: #9aa396; }
    a.btn { border-color: #6bbf5c; color: #8cd44f; }
    a.btn:hover { background: #172113; }
  }
</style>
</head>
<body>
<main>
  <h1>TerraFill</h1>
  <p>
    A jungle arcade game for Android. Claim territory with a caterpillar while
    spiders hunt you across thirty levels.
  </p>
  <nav>
    <a class="btn" href="privacy.html">Privacy Policy</a>
    <a class="btn" href="https://github.com/yanidv-lab/TerraFill">Source on GitHub</a>
  </nav>
</main>
</body>
</html>
